[project]
name = "sampro3d"
version = "0.1.0"
description = "SAMPro3D: Locating SAM prompts in 3D for zero-shot instance segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imageio>=2.37.3,<3",
    "matplotlib>=3.10.9,<4",
    "natsort>=8.4.0,<9",
    "numpy>=1.26.4,<2",
    "open3d>=0.18.0,<0.19",
    "opencv-python>=4.11.0.86,<5",
    "plyfile>=1.1.3,<2",
    "scikit-image>=0.26.0,<0.27",
    "scikit-learn>=1.8.0,<2",
    "setuptools",
    "tqdm>=4.67.3,<5",
    "tyro>=1.0.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
torch       = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio  = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }
pointops = { path = "libs/pointops" }
psdframe = { path = "../../packages/psdframe", editable = true }
initializerdefs = { path = "../../packages/initializerdefs", editable = true }
psdstaticdataset = { path = "../../packages/psdstaticdataset", editable = true }



[tool.pixi.pypi-options]
no-build-isolation = ["pointops"]

[tool.pixi.dependencies]
cuda-version = "12.8.*"
cuda = ">=12.8,<13"
wheel = ">=0.47.0,<0.48"
# Without ninja, torch's BuildExtension falls back to a serial distutils compile
# loop and builds pointops on one core.
ninja = ">=1.11"
# pip is needed by the build_pointops task. It pulls conda setuptools in, which
# must stay <82 -- torch 2.11.0+cu128 declares setuptools<82 and the conda pin
# wins over the pypi solve, so an unpinned setuptools makes the env unsolvable.
pip = ">=24"
setuptools = "<82"

[tool.pixi.activation.env]
# Compute archs used when pixi builds pointops. This must be set: conda's
# cuda-nvcc activation otherwise exports a list containing 10.1, which torch
# does not know and rejects with "Unknown CUDA arch (10.1)".
#
# The list covers Turing through Blackwell natively (torch 2.11+cu128 ships
# sm_75/80/86/90/100/120) and ends in +PTX so later GPUs JIT rather than fail.
# The override has its own name on purpose -- defaulting to TORCH_CUDA_ARCH_LIST
# would inherit the conda value this exists to replace:
#
#     POINTOPS_CUDA_ARCH_LIST=8.6 pixi install    # this GPU only, builds faster
TORCH_CUDA_ARCH_LIST = "${POINTOPS_CUDA_ARCH_LIST:-7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX}"

[tool.pixi.tasks]
# Rebuild the pointops CUDA extension for a different GPU arch than the machine
# that ran `pixi install`. See scripts/build_pointops.sh for when this is needed.
build_pointops = "bash scripts/build_pointops.sh"
proposal = "python 3d_prompt_proposal.py"
segment = "python main.py"
segment_external = "python segment.py"
visualize = "python visualize.py"
view_mesh = "python visualize.py --stage mesh --open3d"
preprocess_2d_scannet = "python dataset_preprocess/preprocess_2d_scannet.py"
